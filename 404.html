<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | مركز الدكتور نشوان الخولاني</title>
    <link rel="stylesheet" href="style.css">
    <!-- استدعاء خط Cairo لضمان التناسق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            text-align: center;
            margin: 0;
        }
        .container-404 {
            padding: 50px 30px;
            border-radius: 20px;
            background-color: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 7em;
            color: #007bff;
            margin: 0;
            line-height: 1;
        }
        h2 {
            font-size: 1.8em;
            margin: 20px 0;
            color: #2c3e50;
        }
        p {
            font-size: 1.1em;
            color: #6c757d;
            margin-bottom: 30px;
        }
        .btn-home {
            display: inline-block;
            padding: 12px 30px;
            background-color: #007bff;
            color: #fff;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.3s ease;
        }
        .btn-home:hover {
            transform: scale(1.05);
            background-color: #0056b3;
            text-decoration: none;
            color: #fff;
        }
        .auto-redirect {
            font-size: 0.9em;
            margin-top: 20px;
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="container-404">
        <h1>404</h1>
        <h2>يبدو أنك ضللت الطريق!</h2>
        <p>الصفحة التي تحاول الوصول إليها غير موجودة أو تم نقلها لعنوان جديد.</p>
        
        <a href="index.html" class="btn-home">العودة للرئيسية</a>

        <p class="auto-redirect">سيتم تحويلك تلقائياً خلال <span id="timer">10</span> ثوانٍ...</p>
    </div>

    <script>
        // كود التحويل التلقائي للرئيسية
        let seconds = 10;
        const timerSpan = document.getElementById('timer');
        
        const countdown = setInterval(() => {
            seconds--;
            timerSpan.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(countdown);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
